# Baked-in framework defaults, loaded because the app sets spring.config.name=ukulele
# (see UkuleleApplication.kt). User configuration — the Discord token, prefix, etc. — lives in the
# external ukulele.yml in the working directory, which is merged over these defaults and wins on
# any overlapping keys.
spring:
  threads:
    virtual:
      # JDK 25 virtual threads (JEP 491 eliminates synchronized carrier-thread pinning).
      enabled: true

server:
  http2:
    # Negotiate HTTP/2 (h2) over TLS via ALPN for REST/Actuator while falling back to HTTP/1.1 for wss:// WebSockets.
    enabled: true
  compression:
    # Uses Spring Boot defaults (includes application/json and application/vnd.spring-boot.actuator.v3+json).
    enabled: true

management:
  server:
    # The main app port (server.port, 11111) is exposed publicly, so actuator is moved to its own
    # port bound to loopback only. This keeps health/metrics/info reachable for local monitoring
    # while keeping them OFF the public interface. NOTE: when server.ssl is enabled the management
    # port inherits TLS, so local checks use https with -k, e.g.
    # curl -k https://127.0.0.1:11112/actuator/health
    # (set management.server.ssl.enabled: false here if you prefer plain HTTP on loopback).
    port: 11112
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # health/info/metrics only. Sensitive endpoints (env, beans, configprops, heapdump,
        # shutdown) stay disabled.
        include: health,info,metrics
  endpoint:
    health:
      # Safe to show details since the management port is loopback-only.
      show-details: always
      probes:
        enabled: true
