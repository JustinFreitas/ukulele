# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Gradle Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'
        cache: 'gradle'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
    - name: Docker Login
      uses: docker/login-action@v3
      if: github.repository == 'JustinFreitas/ukulele'
      with:
        registry: ghcr.io
        username: ${{github.repository_owner}}
        password: ${{secrets.GITHUB_TOKEN}}
    - name: Lowercase repo name
      if: github.repository == 'JustinFreitas/ukulele'
      run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
    - name: Docker build and push
      uses: docker/build-push-action@v6
      if: github.repository == 'JustinFreitas/ukulele'
      with:
        tags: ghcr.io/${{ env.REPO_NAME }}:${{ github.ref_name }}
        push: true
        context: .
    - name: Smoke test Docker container
      if: github.repository == 'JustinFreitas/ukulele'
      run: |
        echo "Testing Docker image: ghcr.io/${{ env.REPO_NAME }}:${{ github.ref_name }}"
        docker pull ghcr.io/${{ env.REPO_NAME }}:${{ github.ref_name }}

        # 1. Create a minimal test configuration and database directory
        mkdir -p ci-test/db
        chmod -R 777 ci-test
        cat << 'EOF' > ci-test/ukulele.yml
        config:
          token: "dummy-token-for-ci-smoke-test"
          apiToken: "ci-test-token"
          database: "./db/database"
        EOF

        # 2. Start container in background
        docker run -d --name ukulele-smoke-test \
          -v "$(pwd)/ci-test/ukulele.yml:/opt/ukulele/ukulele.yml" \
          -v "$(pwd)/ci-test/db:/opt/ukulele/db" \
          -e CONFIG_DATABASE=./db/database \
          -p 8080:8080 \
          ghcr.io/${{ env.REPO_NAME }}:${{ github.ref_name }}

        # 3. Allow time for Spring Boot and JVM startup
        echo "Waiting for container to boot..."
        sleep 12

        # 4. Display container logs
        echo "=== Container Logs ==="
        docker logs ukulele-smoke-test

        # 5. Verify the container process status
        docker ps -a --filter "name=ukulele-smoke-test"

        # 6. Teardown
        docker stop ukulele-smoke-test || true
        docker rm -f ukulele-smoke-test || true
        rm -rf ci-test
